n_trials: 1 # 10 # 40
metric: std_residual
CV:
    train_size: 10
    test_size: 1

### Search spaces ################################

data:
    past_history: [10] # [60, 120, 180]
    forecast_horizon: 1
    autoregressive: True
    narx: False

models: 
    LinearRegression:
        search_space: 
            fit_intercept: True
        package: sklearn.linear_model
        parallelizable: True
        multidimensional_output: True

    RandomForestRegressor: 
        search_space:
            n_estimators: 
                min: 2
                max: 100
            max_depth:
                min: 2
                max: 50
        package: sklearn.ensemble
        parallelizable: True
        multidimensional_output: True

    SVR:
        search_space:
            kernel: [rbf, linear]
            C:
                min: 1.0
                max: 10.0
        package: sklearn.svm
        parallelizable: False
        multidimensional_output: False

    KNeighborsRegressor:
        search_space:
            n_neighbors: 
              min: 2 
              max: 50
        package: sklearn.neighbors
        parallelizable: True
        multidimensional_output: True

    GradientBoostingRegressor:
        search_space:
            n_estimators: 
                min: 2
                max: 100
            max_depth:
                min: 2
                max: 50
            learning_rate:
                min: 0.0001
                max: 0.1
        package: sklearn.ensemble
        parallelizable: False
        multidimensional_output: False

    AdaBoostRegressor:
        search_space:
            n_estimators: 
                min: 2
                max: 100
            learning_rate:
                min: 0.0001
                max: 0.1
        package: sklearn.ensemble
        parallelizable: False
        multidimensional_output: False

    MLPRegressor:
        search_space:
            hidden_layer_sizes: [
                [2],
                [4],
                [8],
                [16],
                [32],
                [64],
                [128],
                [256],
                [512],
                [4, 2],
                [8, 4],
                [16, 8],
                [32, 16],
                [64, 32],
                [128, 64],
                [256, 128],
                [512, 256],
                [8, 4, 2],
                [16, 8, 4],
                [32, 16, 8],
                [64, 32, 16],
                [128, 64, 32],
                [256, 128, 64],
                [512, 256, 128],
            ]
            activation: [tanh, relu, logistic]
            solver: [adam]
            alpha:
                min: 0.0
                max: 0.01
            batch_size: [8, 16, 32, 64, 128]
            learning_rate_init: 
                min: 0.00001
                max: 0.001
            max_iter: 3000
            early_stopping : True
            tol: 10
            validation_fraction: 0.2
            shuffle: False
        package: sklearn.neural_network
        parallelizable: False
        multidimensional_output: True
        
    RNN:
        search_space:
            input_size: 20
            hidden_size: [4, 8, 16, 32]
            n_layers:
                min: 1
                max: 4
            lr: 
                min: 0.00001
                max: 0.001
            batch_size: [8, 16, 32, 64]
            weight_decay: 
                min: 0.0
                max: 0.01 
        package: utils.pytorch_models
        parallelizable: False
        multidimensional_output: False

    GRU:
        search_space:
            input_size: 20
            hidden_size: [4, 8, 16, 32]
            n_layers:
                min: 1
                max: 3
            lr: 
                min: 0.00001
                max: 0.001
            batch_size: [8, 16, 32, 64]
            weight_decay: 
                min: 0.0
                max: 0.01 
        package: utils.pytorch_models
        parallelizable: False
        multidimensional_output: False
    
    LSTM:
        search_space:
            input_size: 20
            hidden_size: [4, 8, 16, 32]
            n_layers:
                min: 1
                max: 3
            lr: 
                min: 0.00001
                max: 0.001
            batch_size: [8, 16, 32, 64]
            weight_decay: 
                min: 0.0
                max: 0.01 
        package: utils.pytorch_models
        parallelizable: False
        multidimensional_output: False

    CNN:
        search_space:
            in_channels: 20
            n_filters: [2, 4, 8, 16, 32] 
            n_layers: 
                min: 1
                max: 4
            kernel_size: [3, 5]
            act_fn: ['relu', 'leaky_relu', 'tanh']
            lr: 
                min: 0.00001
                max: 0.001
            batch_size: [8, 16, 32, 64]
            weight_decay: 
                min: 0.0
                max: 0.01 
        package: utils.pytorch_models
        parallelizable: False
        multidimensional_output: False